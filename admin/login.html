<!DOCTYPE html>
<html class="light" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>تسجيل الدخول | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .login-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-button {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-6 selection:bg-secondary selection:text-white">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 blur-[120px] rounded-full animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/10 blur-[120px] rounded-full animate-pulse" style="animation-delay: 2s"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <div class="login-glass rounded-[40px] overflow-hidden shadow-2xl p-8 md:p-12 text-center">
            <div class="mb-10">
                <div class="w-20 h-20 bg-primary/10 rounded-3xl mx-auto flex items-center justify-center mb-6 border border-primary/20">
                    <span class="material-symbols-outlined text-primary text-4xl">admin_panel_settings</span>
                </div>
                <h1 class="text-white text-3xl font-black tracking-tight font-h1 mb-2">لوحة التحكم</h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.3em]">تسجيل دخول المدير</p>
            </div>

            <form id="login-form" class="space-y-6 text-right">
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest pr-2">اسم المستخدم</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">person</span>
                        <input type="text" id="username" required placeholder="أدخل اسم المستخدم"
                            class="w-full pr-12 pl-6 py-5 bg-white/5 border border-white/10 rounded-2xl focus:border-secondary focus:ring-0 transition-all text-white outline-none">
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest pr-2">كلمة المرور</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">lock</span>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pr-12 pl-6 py-5 bg-white/5 border border-white/10 rounded-2xl focus:border-secondary focus:ring-0 transition-all text-white outline-none">
                    </div>
                </div>

                <div id="error-msg" class="hidden">
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold p-4 rounded-xl flex items-center gap-3 justify-center">
                        <span class="material-symbols-outlined text-sm">error</span>
                        خطأ في اسم المستخدم أو كلمة المرور
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-secondary py-5 rounded-2xl text-white font-black tracking-[0.1em] glow-button hover:scale-[1.02] active:scale-95 transition-all shadow-xl flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">login</span>
                    دخول
                </button>
            </form>

            <div class="mt-12 pt-8 border-t border-white/5">
                <a href="../index.html" class="text-slate-500 hover:text-white text-[10px] font-bold uppercase tracking-widest transition-colors flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    العودة للموقع
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const error = document.getElementById('error-msg');

            if (username === 'basel' && password === '5384358') {
                sessionStorage.setItem('matamkom_admin_auth', 'basel');
                document.querySelector('.login-glass').style.transform = 'scale(0.95)';
                document.querySelector('.login-glass').style.opacity = '0';
                document.querySelector('.login-glass').style.transition = 'all 0.5s ease';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            } else {
                error.classList.remove('hidden');
                document.getElementById('password').value = '';
                const container = document.querySelector('.login-glass');
                container.style.animation = 'none';
                void container.offsetWidth;
                container.style.animation = 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both';
            }
        });
    </script>
    <style>
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</body>
</html>
